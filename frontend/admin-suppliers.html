<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suppliers – MediStore</title><link rel="stylesheet" href="css/style.css"></head>
<body><main id="content" class="content">
<div class="page-head"><h1>Suppliers</h1><button id="addBtn">+ Add supplier</button></div>
<div class="toolbar"><input id="q" class="grow" type="search" placeholder="Search name, company, contact or phone" aria-label="Search suppliers">
<select id="status" aria-label="Filter by status"><option value="">Any status</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
<div class="table-wrap"><table><thead><tr><th>Supplier</th><th>Contact</th><th>GST</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager" id="pager"></div>
</main><div id="toasts" aria-live="polite"></div>
<script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/suppliers.js"></script></body></html>
