<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orders – MediStore</title><link rel="stylesheet" href="css/style.css"></head>
<body><main id="content" class="content">
<div class="page-head"><h1>Orders</h1></div>
<div class="toolbar"><input id="q" class="grow" type="search" placeholder="Order #, customer name, email or phone" aria-label="Search orders">
<select id="status" aria-label="Filter by status"><option value="">All statuses</option><option value="active">In progress (not delivered/cancelled)</option><option>Pending</option><option>Confirmed</option><option>Processing</option><option>Packed</option><option>Dispatched</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select>
<div><label class="sr-only" for="from">From</label><input id="from" type="date" title="From date"></div><div><label class="sr-only" for="to">To</label><input id="to" type="date" title="To date"></div></div>
<div class="table-wrap"><table><thead><tr><th>Order</th><th>Placed</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager" id="pager"></div>
</main><div id="toasts" aria-live="polite"></div>
<script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/admin-orders.js"></script></body></html>
