<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Users – MediStore</title><link rel="stylesheet" href="css/style.css"></head>
<body><main id="content" class="content">
<div class="page-head"><h1>Users</h1><button id="addBtn">+ Add user</button></div>
<div class="toolbar"><input id="q" class="grow" type="search" placeholder="Search name, email or phone" aria-label="Search users">
<select id="role" aria-label="Filter by role"><option value="">All roles</option><option value="admin">Admin</option><option value="pharmacist">Pharmacist</option><option value="customer">Customer</option></select>
<select id="status" aria-label="Filter by status"><option value="">Any status</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager" id="pager"></div>
</main><div id="toasts" aria-live="polite"></div>
<script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/users.js"></script></body></html>
