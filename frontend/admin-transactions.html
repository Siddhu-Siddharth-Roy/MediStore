<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock movements – MediStore</title><link rel="stylesheet" href="css/style.css"></head>
<body><main id="content" class="content">
<div class="page-head"><h1>Stock movements</h1></div><div id="chip"></div>
<div class="toolbar"><select id="type" aria-label="Type"><option value="">All types</option><option>PURCHASE</option><option>SALE</option><option>RETURN</option><option>EXPIRED</option><option>DAMAGED</option><option>ADJUSTMENT</option></select>
<div><label class="sr-only" for="from">From</label><input id="from" type="date" title="From date"></div><div><label class="sr-only" for="to">To</label><input id="to" type="date" title="To date"></div></div>
<div class="table-wrap"><table><thead><tr><th>Date</th><th>Medicine</th><th>Batch</th><th>Type</th><th>Change</th><th>Ref</th><th>Remarks</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager" id="pager"></div>
</main><div id="toasts" aria-live="polite"></div>
<script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/transactions.js"></script></body></html>
