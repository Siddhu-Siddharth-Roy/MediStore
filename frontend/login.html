<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – MediStore</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="auth-wrap"><div class="card"><h1>💊 MediStore Login</h1>
<form id="f" novalidate>
<label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email">
<label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
<button type="submit">Login</button><div id="msg" class="msg" role="alert"></div></form>
<p class="alt">New here? <a href="register.html">Create an account</a></p></div></main>
<script src="js/api.js"></script>
<script src="js/login.js"></script></body></html>
