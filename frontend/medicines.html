<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medicines – MediStore</title><link rel="stylesheet" href="css/style.css"></head>
<body><main id="content" class="content">
<div class="page-head"><h1>Medicines</h1></div>
<div class="toolbar"><input id="q" class="grow" type="search" placeholder="Search medicines, generic names or brands" aria-label="Search medicines">
<select id="cat" aria-label="Category"><option value="">All categories</option></select>
<select id="mfr" aria-label="Manufacturer"><option value="">All manufacturers</option></select>
<select id="sort" aria-label="Sort"><option value="name|asc">Name A–Z</option><option value="selling_price|asc">Price low–high</option><option value="selling_price|desc">Price high–low</option></select></div>
<div class="cards" id="cards" aria-live="polite"></div><div class="pager" id="pager"></div>
</main><div id="toasts" aria-live="polite"></div>
<script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/catalog.js"></script></body></html>
