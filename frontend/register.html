<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register – MediStore</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="auth-wrap"><div class="card"><h1>💊 Create Account</h1>
<form id="f" novalidate>
<label for="name">Full name</label><input id="name" name="name" required>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="phone">Phone (optional)</label><input id="phone" name="phone" type="tel">
<label for="password">Password (8+ chars, include a number)</label><input id="password" name="password" type="password" required autocomplete="new-password">
<button type="submit">Register</button><div id="msg" class="msg" role="alert"></div></form>
<p class="alt">Already registered? <a href="login.html">Login</a></p></div></main>
<script src="js/api.js"></script>
<script src="js/register.js"></script></body></html>
